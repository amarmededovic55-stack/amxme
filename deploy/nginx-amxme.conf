# Signed: ASDHEM | AMXME Web Solutions
# Nginx site for __DOMAIN__  ->  /etc/nginx/sites-available/amxme
# HTTPS is added afterwards by: sudo certbot --nginx -d __DOMAIN__ -d www.__DOMAIN__
limit_req_zone $binary_remote_addr zone=amx_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=amx_contact:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=amx_general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=amx_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    limit_conn amx_conn 25;
    send_timeout 20s;
    large_client_header_buffers 4 8k;
    server_tokens off;
    client_max_body_size 14M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    # never serve hidden files (.env, .git ...)
    location ~ /\. { deny all; return 404; }

    location /static/ {
        alias /opt/amxme/app/static/;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }
    location /uploads/ {
        alias /opt/amxme/data/uploads/;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        access_log off;
    }
    location = /admin/login {
        limit_req zone=amx_login burst=5 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8002;
    }
    location = /admin/login/2fa {
        limit_req zone=amx_login burst=5 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8002;
    }
    location = /contact {
        limit_req zone=amx_contact burst=3 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8002;
    }
    location / {
        limit_req zone=amx_general burst=40 nodelay;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8002;
    }
}
