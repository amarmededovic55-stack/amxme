{% extends "portal/_base.html" %}
{% block title %}{{ t('p_change_pw') }} – {{ c.company_name }}{% endblock %}
{% block page %}
<div class="auth-card">
  <h1>{{ t('p_change_pw') }}</h1>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ t('p_current_pw') }}<input type="password" name="current" autocomplete="current-password" required></label>
    <label>{{ t('p_new_pw') }}<input type="password" name="password" autocomplete="new-password" required minlength="10"></label>
    <button class="btn btn-primary btn-block">{{ t('p_set_pw') }}</button>
  </form>
  <a href="{{ url_for('portal.home') }}" class="link-small">{{ t('p_back') }}</a>
</div>
{% endblock %}
