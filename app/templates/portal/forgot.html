{% extends "portal/_base.html" %}
{% block title %}{{ t('p_forgot') }} – {{ c.company_name }}{% endblock %}
{% block page %}
<div class="auth-card">
  <h1>{{ t('p_forgot') }}</h1>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ t('p_email') }}<input type="email" name="email" required maxlength="200"></label>
    <button class="btn btn-primary btn-block">{{ t('p_reset_btn') }}</button>
  </form>
  <a href="{{ url_for('portal.login') }}" class="link-small">{{ t('p_back') }}</a>
</div>
{% endblock %}
