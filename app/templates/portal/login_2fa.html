{% extends "portal/_base.html" %}
{% block title %}{{ t('p_2fa') }} – {{ t('p_title') }}{% endblock %}
{% block page %}
<div class="auth-card">
  <span class="sub-ic">{{ icon('shield-check') }}</span>
  <h1>{{ t('p_2fa') }}</h1>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ t('p_code') }}<input name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="8" autofocus></label>
    <button class="btn btn-primary btn-block">{{ t('p_verify') }}</button>
  </form>
  <a href="{{ url_for('portal.login') }}" class="link-small">{{ t('p_back') }}</a>
</div>
{% endblock %}
