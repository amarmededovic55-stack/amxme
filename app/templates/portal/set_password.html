{% extends "portal/_base.html" %}
{% block title %}{{ t('p_set_pw') }} – {{ c.company_name }}{% endblock %}
{% block page %}
<div class="auth-card">
  <h1>{{ t('p_hello') }} {{ client.name }}</h1>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="email" name="username" value="{{ client.email }}" autocomplete="username" hidden>
    <label>{{ t('p_new_pw') }}<input type="password" name="password" autocomplete="new-password" required minlength="10" maxlength="200"></label>
    <button class="btn btn-primary btn-block">{{ t('p_set_pw') }}</button>
  </form>
</div>
{% endblock %}
